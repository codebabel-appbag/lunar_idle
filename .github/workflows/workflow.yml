name: Build Lunar IDE Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.system }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            system: windows
            arch: x86_64
            folder: windows
            filename: lunar_idle_x86_64.exe
          
          # Ubuntu x86_64
          - os: ubuntu-latest
            system: ubuntu
            arch: x86_64
            folder: ubuntu
            filename: lunar_idle_x86_64
          
          # Fedora x86_64
          - os: ubuntu-latest
            system: fedora
            arch: x86_64
            folder: fedora
            filename: lunar_idle_x86_64

          # Debian x86_64
          - os: ubuntu-latest
            system: debian
            arch: x86_64
            folder: debian
            filename: lunar_idle_x86_64

          # Arch Linux x86_64
          - os: ubuntu-latest
            system: archlinux
            arch: x86_64
            folder: archlinux
            filename: lunar_idle_x86_64

          # openSUSE (SUSE) x86_64
          - os: ubuntu-latest
            system: suse
            arch: x86_64
            folder: suse
            filename: lunar_idle_x86_64

          # Gentoo x86_64
          - os: ubuntu-latest
            system: gentoo
            arch: x86_64
            folder: gentoo
            filename: lunar_idle_x86_64

          # Slackware x86_64
          - os: ubuntu-latest
            system: slackware
            arch: x86_64
            folder: slackware
            filename: lunar_idle_x86_64

          # Solus x86_64
          - os: ubuntu-latest
            system: solus
            arch: x86_64
            folder: solus
            filename: lunar_idle_x86_64

          # Void Linux x86_64
          - os: ubuntu-latest
            system: void_linux
            arch: x86_64
            folder: void_linux
            filename: lunar_idle_x86_64

          # Raspberry Pi ARM64 (AArch64)
          - os: ubuntu-latest
            system: raspberry
            arch: arm64
            folder: raspberry
            filename: lunar_idle_arm64

          # Raspberry Pi ARM32 (ARMv7)
          - os: ubuntu-latest
            system: raspberry
            arch: armv7l
            folder: raspberry
            filename: lunar_idle_arm32

          # macOS Intel (x86_64)
          - os: macos-13
            system: macos
            arch: x86_64
            folder: macos
            filename: lunar_idle_intel.app
          
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            system: macos
            arch: arm64
            folder: macos
            filename: lunar_idle_arm64.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: 'pip'

      # QEMU para builds ARM do Raspberry Pi
      - name: Set up QEMU for ARM builds
        if: matrix.system == 'raspberry'
        uses: docker/setup-qemu-action@v3

      - name: Set up UPX (Windows & Linux x86_64)
        if: matrix.system != 'macos' && matrix.arch == 'x86_64'
        uses: crazy-max/ghaction-upx@v4
        with:
          version: '4.2.2'
          install-only: true

      # Build: Windows
      - name: Build Windows x86_64
        if: matrix.system == 'windows'
        run: |
          pip install customtkinter pyinstaller
          pyinstaller lunaridle_project/build/lunar_idle.spec

      # Build: Ubuntu
      - name: Build Ubuntu x86_64
        if: matrix.system == 'ubuntu'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk libxcb-cursor0
          pip install customtkinter pyinstaller
          pyinstaller lunaridle_project/build/lunar_idle.spec

      # Build: Fedora x86_64 via Docker
      - name: Build Fedora x86_64 via Docker
        if: matrix.system == 'fedora'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace fedora:40 bash -c "
            dnf install -y python3 python3-pip python3-tkinter libxcb xcb-util-cursor binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Debian x86_64 via Docker
      - name: Build Debian x86_64 via Docker
        if: matrix.system == 'debian'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:bookworm-slim bash -c "
            apt-get update && apt-get install -y python3 python3-pip python3-tk libxcb-cursor0 binutils
            pip install --break-system-packages --upgrade pip
            pip install --break-system-packages customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Arch Linux x86_64 via Docker
      - name: Build Arch Linux x86_64 via Docker
        if: matrix.system == 'archlinux'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace archlinux:base-devel bash -c "
            pacman -Syu --noconfirm python python-pip tk xcb-util-cursor binutils
            pip install --break-system-packages --upgrade pip
            pip install --break-system-packages customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: openSUSE (suse) x86_64 via Docker
      - name: Build SUSE x86_64 via Docker
        if: matrix.system == 'suse'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace opensuse/leap:15.5 bash -c "
            zypper refresh && zypper install -y python3 python3-pip python3-tk libxcb-cursor0 binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Gentoo x86_64 via Docker
      - name: Build Gentoo x86_64 via Docker
        if: matrix.system == 'gentoo'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace gentoo/stage3:latest bash -c "
            emerge --quiet --update --deep @world
            emerge --quiet dev-lang/python dev-python/pip dev-python/tkinter x11-libs/libxcb x11-libs/xcb-util-cursor sys-devel/binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Slackware x86_64 via Docker
      - name: Build Slackware x86_64 via Docker
        if: matrix.system == 'slackware'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace vbatts/slackware:latest bash -c "
            slackpkg update && slackpkg install -y python3 tkinter libxcb xcb-util-cursor binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Solus x86_64 via Docker
      - name: Build Solus x86_64 via Docker
        if: matrix.system == 'solus'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace solus:latest bash -c "
            eopkg update-repo -y && eopkg upgrade -y
            eopkg install -y python3 python3-devel tk libxcb cursor-util binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Void Linux x86_64 via Docker
      - name: Build Void Linux x86_64 via Docker
        if: matrix.system == 'void_linux'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace voidlinux/voidlinux:latest bash -c "
            xbps-install -Syu && xbps-install -y python3 python3-pip tk libxcb-devel xcb-util-cursor-devel binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: Raspberry Pi (ARM32 / ARM64 via Docker + QEMU)
      - name: Build Raspberry Pi via Docker & QEMU
        if: matrix.system == 'raspberry'
        run: |
          DOCKER_ARCH=""
          if [[ "${{ matrix.arch }}" == "arm64" ]]; then
            DOCKER_ARCH="linux/arm64/v8"
          elif [[ "${{ matrix.arch }}" == "armv7l" ]]; then
            DOCKER_ARCH="linux/arm/v7"
          fi

          docker run --rm --platform $DOCKER_ARCH -v ${{ github.workspace }}:/workspace -w /workspace python:3.12-slim bash -c "
            apt-get update && apt-get install -y tk libxcb-cursor0 binutils
            pip install --upgrade pip
            pip install customtkinter pyinstaller
            pyinstaller lunaridle_project/build/lunar_idle.spec
          "

      # Build: macOS
      - name: Build macOS
        if: matrix.system == 'macos'
        run: |
          pip install customtkinter pyinstaller
          pyinstaller lunaridle_project/build/lunar_idle.spec

      # Organização dos Artefatos seguindo o padrão de nomenclatura por arquitetura
      - name: Organize Artifacts
        shell: bash
        run: |
          TARGET_DIR="lunaridle_project/workflow/${{ matrix.folder }}"
          mkdir -p "$TARGET_DIR"

          if [[ "${{ matrix.system }}" == "macos" ]]; then
            mv dist/lunar_idle.app "$TARGET_DIR/${{ matrix.filename }}"
          else
            if [[ "${{ matrix.system }}" == "windows" ]]; then
              mv dist/lunar_idle.exe "$TARGET_DIR/${{ matrix.filename }}"
            else
              mv dist/lunar_idle "$TARGET_DIR/${{ matrix.filename }}"
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-ide-${{ matrix.system }}-${{ matrix.arch }}
          path: lunaridle_project/workflow/${{ matrix.folder }}/
