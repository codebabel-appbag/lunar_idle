name: lunar_idle TigerOS(x86_64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tigeros:
    name: Build for TigerOS (x86_64)
    runs-on: tigeros-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: ''

      - name: Build TigerOS x86_64
        run: |
          pip install customtkinter pyinstaller
          python3 -m PyInstaller lunaridle_project/build/lunar_idle.spec --distpath dist --workpath build

      - name: Organize Artifacts
        run: |
          TARGET_DIR="lunaridle_project/workflow/global"
          mkdir -p "$TARGET_DIR"
          
          if [ -f "dist/lunar_idle" ]; then
            cp "dist/lunar_idle" "$TARGET_DIR/lunar_idle_TigerOs_x86_64"
            chmod +x "$TARGET_DIR/lunar_idle_TigerOs_x86_64"
            echo "Copiado com sucesso para $TARGET_DIR/lunar_idle_TigerOs_x86_64"
          elif [ -f "dist/lunar_idle.bin" ]; then
            cp "dist/lunar_idle.bin" "$TARGET_DIR/lunar_idle_TigerOs_x86_64"
            chmod +x "$TARGET_DIR/lunar_idle_TigerOs_x86_64"
            echo "Copiado com sucesso para $TARGET_DIR/lunar_idle_TigerOs_x86_64"
          else
            echo "Erro crítico: Binário não encontrado na pasta dist."
            exit 1
          fi

      - name: Commit and Push Binary
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lunaridle_project/workflow/global/lunar_idle_TigerOs_x86_64
          git status
          
          GIT_STATUS=$(git status --porcelain)
          if [ -n "$GIT_STATUS" ]; then
            git commit -m "chore: update automated tigeros build binary [skip ci]"
            git push
            echo "Binário do TigerOS enviado com sucesso para o repositório!"
          else
            echo "Nenhuma alteração detectada para commit."
          fi
