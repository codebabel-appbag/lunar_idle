name: lunar_idle_debian(x86_64:v2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian:
    name: Build for Debian (x86_64)
    runs-on: ubuntu-latest
    container:
      image: debian:latest

    steps:
      - name: Install system dependencies (git, python, build tools)
        run: |
          apt-get update && apt-get install -y git python3 python3-pip python3-dev build-essential

      - name: Mark workspace safe for git
        run: |
          git config --global --add safe.directory /__w/lunar_idle/lunar_idle
          git config --global --add safe.directory /__/_/lunar_idle/lunar_idle

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python dependencies
        run: |
          pip3 install --no-cache-dir --break-system-packages customtkinter pyinstaller

      - name: Build Debian x86_64
        run: |
          python3 -m PyInstaller lunaridle_project/build/lunar_idle.spec --distpath dist --workpath build

      - name: Organize Artifacts
        run: |
          TARGET_DIR="lunaridle_project/workflow/debian"
          mkdir -p "$TARGET_DIR"
          
          if [ -f "dist/lunar_idle" ]; then
            cp "dist/lunar_idle" "$TARGET_DIR/lunar_idle_debian_x86_64"
            chmod +x "$TARGET_DIR/lunar_idle_debian_x86_64"
            echo "Copiado com sucesso para $TARGET_DIR/lunar_idle_debian_x86_64"
          elif [ -f "dist/lunar_idle.bin" ]; then
            cp "dist/lunar_idle.bin" "$TARGET_DIR/lunar_idle_debian_x86_64"
            chmod +x "$TARGET_DIR/lunar_idle_debian_x86_64"
            echo "Copiado com sucesso para $TARGET_DIR/lunar_idle_debian_x86_64"
          else
            echo "Erro crítico: Binário não encontrado na pasta dist."
            exit 1
          fi

      - name: Commit and Push Binary
        run: |
          git config --global --add safe.directory /__w/lunar_idle/lunar_idle
          git config --global --add safe.directory /__/_/lunar_idle/lunar_idle
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lunaridle_project/workflow/debian/lunar_idle_debian_x86_64
          git status
          
          GIT_STATUS=$(git status --porcelain)
          if [ -n "$GIT_STATUS" ]; then
            git commit -m "chore: update automated debian build binary [skip ci]"
            git push
            echo "Binário do Debian enviado com sucesso!"
          else
            echo "Nenhuma alteração detectada para commit."
          fi
