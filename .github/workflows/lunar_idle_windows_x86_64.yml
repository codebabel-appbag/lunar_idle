name: Build Lunar IDE for Windows(x86_64:v4)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build for Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: ''

      - name: Build Windows x86_64
        run: |
          pip install customtkinter pyinstaller
          python -m PyInstaller lunaridle_project/build/lunar_idle.spec --distpath dist --workpath build

      - name: Organize Artifacts
        shell: pwsh
        run: |
          $targetDir = "lunaridle_project/workflow/windows"
          New-Item -ItemType Directory -Force -Path $targetDir
          
          if (Test-Path "dist/lunar_idle.exe") {
            Copy-Item -Path "dist/lunar_idle.exe" -Destination "$targetDir/lunar_idle_x86_64.exe" -Force
            Write-Host "Copiado com sucesso para $targetDir/lunar_idle_x86_64.exe"
          } else {
            Write-Error "Erro crítico: dist/lunar_idle.exe não foi encontrado."
            exit 1
          }

      - name: Commit and Push Binary
        shell: pwsh
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add lunaridle_project/workflow/windows/lunar_idle_x86_64.exe
          git status
          
          # Verifica se há alterações para commitar
          $gitStatus = git status --porcelain
          if (-not [string]::IsNullOrEmpty($gitStatus)) {
            git commit -m "chore: update automated windows build binary [skip ci]"
            git push
            Write-Host "Binário enviado com sucesso para o repositório!"
          } else {
            Write-Host "Nenhuma alteração detectada para commit."
          }
