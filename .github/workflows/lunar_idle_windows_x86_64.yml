name: Build Lunar IDE for Windows(x86_64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: ''

      - name: Build Windows x86_64
        run: |
          pip install customtkinter pyinstaller
          python -m PyInstaller lunaridle_project/build/lunar_idle.spec --distpath dist --workpath build

      - name: Organize Artifacts
        shell: bash
        run: |
          TARGET_DIR="lunaridle_project/workflow/windows"
          mkdir -p "$TARGET_DIR"
          
          echo "Conteúdo da raiz do repositório:"
          ls -la
          
          if [ -d "dist" ]; then
            echo "Conteúdo da pasta dist:"
            ls -la dist/
          else
            echo "Aviso: A pasta dist não existe!"
          fi

          FOUND_EXE=$(find . -type f -name "*.exe")
          
          if [ -n "$FOUND_EXE" ]; then
            echo "Executável encontrado: $FOUND_EXE"
            cp "$FOUND_EXE" "$TARGET_DIR/lunar_idle_x86_64.exe"
            ls -la "$TARGET_DIR"
          else
            echo "Erro crítico: Nenhum arquivo .exe foi gerado pelo PyInstaller."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunar-ide-windows-x86_64
          path: lunaridle_project/workflow/windows/
